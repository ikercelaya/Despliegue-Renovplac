<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Renovebot — Renoveplac</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: #f3f6f4;
        color: #17221d;
        display: grid;
        place-items: center;
        padding: 20px;
      }
      .chat-widget {
        width: min(100%, 460px);
        height: min(760px, calc(100vh - 40px));
        background: #ffffff;
        border: 1px solid #dfe8e2;
        border-radius: 8px;
        box-shadow: 0 18px 50px rgba(20, 35, 28, 0.14);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .chat-header {
        background: #143c32;
        color: #ffffff;
        padding: 16px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .chat-header-text { flex: 1; min-width: 0; }
      .reset-button {
        flex: 0 0 auto;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.25);
        background: transparent;
        color: #ffffff;
        cursor: pointer;
        display: grid;
        place-items: center;
        transition: background 0.15s, transform 0.2s;
      }
      .reset-button:hover { background: rgba(255, 255, 255, 0.15); }
      .reset-button:active { transform: rotate(-90deg); }
      .avatar {
        width: 42px; height: 42px;
        border-radius: 50%;
        background: #2fd07f;
        color: #10241d;
        display: grid;
        place-items: center;
        font-weight: 800;
        flex: 0 0 auto;
      }
      .chat-title { margin: 0; font-size: 17px; line-height: 1.2; }
      .chat-status { margin: 3px 0 0; font-size: 13px; color: #cceedd; }
      .messages {
        flex: 1;
        padding: 18px 14px;
        overflow-y: auto;
        background:
          linear-gradient(rgba(255, 255, 255, 0.86), rgba(255, 255, 255, 0.86)),
          repeating-linear-gradient(45deg, #e5eee8 0, #e5eee8 1px, transparent 1px, transparent 18px);
      }
      .message-row { display: flex; margin-bottom: 12px; }
      .message-row.user { justify-content: flex-end; }
      .message {
        max-width: 82%;
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 15px;
        line-height: 1.4;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .message.bot { background: #ffffff; border: 1px solid #e1e8e3; border-top-left-radius: 2px; }
      .message.user { background: #d9fdd3; border-top-right-radius: 2px; }
      .message.admin { background: #fff9d6; border: 1px solid #ecdf90; border-top-left-radius: 2px; }
      .budget-card {
        max-width: 92%;
        margin: 0 0 12px;
        padding: 14px;
        border: 1px solid #143c32;
        background: #f3fbf6;
        border-radius: 10px;
      }
      .budget-card h3 { margin: 0 0 6px; font-size: 15px; color: #143c32; }
      .budget-card .amount { font-size: 20px; font-weight: 800; color: #143c32; margin: 6px 0; }
      .budget-card .desc { font-size: 14px; line-height: 1.4; white-space: pre-wrap; }
      .budget-card .actions { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
      .budget-card button {
        border: 0;
        border-radius: 6px;
        padding: 8px 14px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }
      .budget-card .accept { background: #143c32; color: #fff; }
      .budget-card .accepted-tag {
        display: inline-block;
        margin-top: 8px;
        padding: 4px 8px;
        background: #143c32;
        color: #fff;
        border-radius: 4px;
        font-size: 12px;
      }
      .typing { display: none; color: #5d6d66; font-size: 14px; padding: 0 16px 12px; background: #ffffff; }
      .typing.visible { display: block; }
      .message .msg-image {
        display: block;
        max-width: 100%;
        max-height: 280px;
        border-radius: 6px;
        margin-bottom: 6px;
        cursor: zoom-in;
      }
      .message .msg-image:only-child { margin-bottom: 0; }
      .chat-form-wrap {
        border-top: 1px solid #e0e7e3;
        background: #ffffff;
      }
      .attach-preview {
        display: none;
        align-items: center;
        gap: 10px;
        padding: 8px 12px 0;
      }
      .attach-preview.visible { display: flex; }
      .attach-preview img {
        width: 50px; height: 50px;
        object-fit: cover;
        border-radius: 6px;
        border: 1px solid #cfdad4;
      }
      .attach-preview .info {
        flex: 1;
        font-size: 12.5px;
        color: #5d6d66;
        line-height: 1.3;
      }
      .attach-preview .remove-attach {
        border: 0;
        background: transparent;
        color: #b00020;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        padding: 4px 8px;
      }
      .chat-form {
        display: flex;
        gap: 8px;
        padding: 12px;
        align-items: center;
      }
      .attach-button {
        flex: 0 0 auto;
        width: 40px; height: 40px;
        border-radius: 50%;
        border: 1px solid #cfdad4;
        background: #ffffff;
        color: #143c32;
        cursor: pointer;
        display: grid;
        place-items: center;
        transition: background 0.15s;
      }
      .attach-button:hover { background: #f3f6f4; }
      .attach-button.has-image { border-color: #2fd07f; background: #e8fbef; }
      .attach-button:disabled { opacity: 0.5; cursor: not-allowed; }
      .chat-input {
        flex: 1;
        border: 1px solid #cfdad4;
        border-radius: 8px;
        padding: 12px;
        font-size: 15px;
        min-width: 0;
      }
      .chat-input:focus {
        outline: 2px solid rgba(47, 208, 127, 0.3);
        border-color: #31a66d;
      }
      .send-button {
        flex: 0 0 auto;
        width: 44px;
        height: 44px;
        border: 0;
        border-radius: 50%;
        background: #2fd07f;
        color: #10241d;
        cursor: pointer;
        display: grid;
        place-items: center;
        transition: background 0.15s, transform 0.1s;
        box-shadow: 0 2px 6px rgba(47, 208, 127, 0.35);
      }
      .send-button:hover { background: #28b86d; }
      .send-button:active { transform: scale(0.94); }
      .send-button svg { width: 20px; height: 20px; }
      .send-button:disabled, .chat-input:disabled { opacity: 0.5; cursor: not-allowed; }
      .send-button:disabled { background: #a9d8bc; box-shadow: none; }
      @media (max-width: 520px) {
        body { padding: 0; }
        .chat-widget { width: 100%; height: 100vh; border-radius: 0; border: 0; }
      }
    </style>
  </head>
  <body>
    <main class="chat-widget" aria-label="Chat de Renovebot">
      <header class="chat-header">
        <div class="avatar" aria-hidden="true">R</div>
        <div class="chat-header-text">
          <h1 class="chat-title">Renovebot</h1>
          <p class="chat-status" id="chatStatus">Asistente de Renoveplac</p>
        </div>
        <button class="reset-button" id="resetButton" type="button" title="Empezar conversación nueva" aria-label="Empezar conversación nueva">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="1 4 1 10 7 10"></polyline>
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
          </svg>
        </button>
      </header>

      <section class="messages" id="messages" aria-live="polite"></section>
      <div class="typing" id="typing">Renovebot está escribiendo...</div>

      <div class="chat-form-wrap">
        <div class="attach-preview" id="attachPreview">
          <img id="attachThumb" alt="Vista previa" />
          <div class="info" id="attachInfo"></div>
          <button type="button" class="remove-attach" id="removeAttach" aria-label="Quitar imagen">Quitar</button>
        </div>
        <form class="chat-form" id="chatForm">
          <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp,image/gif,image/heic,image/heif" hidden />
          <button type="button" class="attach-button" id="attachButton" title="Adjuntar imagen" aria-label="Adjuntar imagen">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
            </svg>
          </button>
          <input
            class="chat-input"
            id="messageInput"
            type="text"
            autocomplete="off"
            placeholder="Escribe tu mensaje..."
            aria-label="Mensaje"
          />
          <button class="send-button" id="sendButton" type="submit" aria-label="Enviar">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M8 5v14l11-7z"></path>
            </svg>
          </button>
        </form>
      </div>
    </main>

    <script>
      const messagesEl = document.getElementById("messages");
      const typingEl = document.getElementById("typing");
      const chatForm = document.getElementById("chatForm");
      const messageInput = document.getElementById("messageInput");
      const sendButton = document.getElementById("sendButton");
      const chatStatus = document.getElementById("chatStatus");

      const params = new URLSearchParams(window.location.search);
      const urlToken = params.get("t");
      const emailConfirmed = params.get("email_confirmed") === "1";
      const STORAGE_KEY = "renovebot.conversationId";

      let conversationId = urlToken ? null : localStorage.getItem(STORAGE_KEY);
      let accessToken = urlToken || null;
      let lastMessageAt = null;
      let chatRequestInFlight = false;
      let pendingAttachment = null;
      const renderedMessageIds = new Set();
      const renderedBudgets = new Map();

      const attachButton = document.getElementById("attachButton");
      const fileInput = document.getElementById("fileInput");
      const attachPreview = document.getElementById("attachPreview");
      const attachThumb = document.getElementById("attachThumb");
      const attachInfo = document.getElementById("attachInfo");
      const removeAttachBtn = document.getElementById("removeAttach");

      const MAX_IMAGE_BYTES = 5 * 1024 * 1024;
      const ALLOWED_TYPES = ["image/jpeg", "image/png", "image/webp", "image/gif", "image/heic", "image/heif"];

      function formatBytes(n) {
        if (n < 1024) return n + " B";
        if (n < 1024 * 1024) return (n / 1024).toFixed(0) + " KB";
        return (n / (1024 * 1024)).toFixed(1) + " MB";
      }
      function clearAttachment() {
        pendingAttachment = null;
        fileInput.value = "";
        attachPreview.classList.remove("visible");
        attachThumb.removeAttribute("src");
        attachInfo.textContent = "";
        attachButton.classList.remove("has-image");
      }
      function setAttachment(file) {
        if (!ALLOWED_TYPES.includes(file.type)) {
          alert("Tipo de imagen no soportado.");
          return;
        }
        if (file.size > MAX_IMAGE_BYTES) {
          alert("La imagen es demasiado grande (máx 5 MB).");
          return;
        }
        const reader = new FileReader();
        reader.onload = function () {
          const dataUrl = String(reader.result || "");
          const m = /^data:[^;]+;base64,(.+)$/.exec(dataUrl);
          pendingAttachment = {
            preview: dataUrl,
            base64: m ? m[1] : dataUrl,
            mimeType: file.type,
            name: file.name,
            size: file.size,
          };
          attachThumb.src = dataUrl;
          attachInfo.textContent = file.name + " · " + formatBytes(file.size);
          attachPreview.classList.add("visible");
          attachButton.classList.add("has-image");
        };
        reader.readAsDataURL(file);
      }

      attachButton.addEventListener("click", () => fileInput.click());
      fileInput.addEventListener("change", (e) => {
        const f = e.target.files && e.target.files[0];
        if (f) setAttachment(f);
      });
      removeAttachBtn.addEventListener("click", clearAttachment);

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function renderMessage(msg) {
        if (msg.id && renderedMessageIds.has(msg.id)) return;
        if (msg.id) renderedMessageIds.add(msg.id);
        if (msg.created_at) lastMessageAt = msg.created_at;
        const row = document.createElement("div");
        row.className = "message-row " + (msg.role === "user" ? "user" : "bot");
        const bubble = document.createElement("div");
        const cls = msg.role === "user" ? "user" : msg.role === "admin" ? "admin" : "bot";
        bubble.className = "message " + cls;
        if (msg.image_url) {
          const img = document.createElement("img");
          img.className = "msg-image";
          img.src = msg.image_url;
          img.alt = "Imagen adjunta";
          img.addEventListener("click", () => window.open(msg.image_url, "_blank"));
          bubble.appendChild(img);
        }
        const text = String(msg.content || "");
        if (text && text !== "(imagen)") {
          const textEl = document.createElement("div");
          textEl.textContent = text;
          bubble.appendChild(textEl);
        }
        row.appendChild(bubble);
        messagesEl.appendChild(row);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function renderBudget(b) {
        const existing = renderedBudgets.get(b.id);
        if (existing) {
          if (b.status === "accepted" && !existing.dataset.accepted) {
            existing.querySelector(".actions").innerHTML =
              '<span class="accepted-tag">Aceptado</span>';
            existing.dataset.accepted = "1";
          }
          return;
        }
        const card = document.createElement("div");
        card.className = "budget-card";
        const ivaTxt = b.iva_included ? "(IVA incluido)" : "+ IVA aparte";
        card.innerHTML =
          '<h3>' + escapeHtml(b.title) + '</h3>' +
          '<div class="amount">' + Number(b.amount_eur).toLocaleString("es-ES") + ' € <span style="font-weight:400;font-size:12px;">' + ivaTxt + '</span></div>' +
          '<div class="desc">' + escapeHtml(b.description) + '</div>' +
          '<div class="actions"></div>';
        const actions = card.querySelector(".actions");
        if (b.status === "accepted") {
          actions.innerHTML = '<span class="accepted-tag">Aceptado</span>';
          card.dataset.accepted = "1";
        } else {
          const btn = document.createElement("button");
          btn.className = "accept";
          btn.textContent = "Aceptar presupuesto";
          btn.addEventListener("click", () => acceptBudget(b.id, btn));
          actions.appendChild(btn);
        }
        messagesEl.appendChild(card);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        renderedBudgets.set(b.id, card);
      }

      async function acceptBudget(id, btn) {
        btn.disabled = true;
        btn.textContent = "Aceptando...";
        try {
          const r = await fetch("/api/budget/" + id + "/accept", { method: "POST" });
          const data = await r.json().catch(() => ({}));
          if (!r.ok) {
            if (data.requiresEmailConfirmation) {
              renderMessage({ role: "assistant", content: data.error });
              btn.disabled = false;
              btn.textContent = "Aceptar presupuesto";
              return;
            }
            throw new Error(data.error || "Error");
          }
          const card = renderedBudgets.get(id);
          if (card) {
            card.querySelector(".actions").innerHTML = '<span class="accepted-tag">Aceptado</span>';
            card.dataset.accepted = "1";
          }
          poll();
        } catch (err) {
          btn.disabled = false;
          btn.textContent = "Aceptar presupuesto";
          alert("No se pudo aceptar: " + err.message);
        }
      }

      function setLoading(isLoading) {
        typingEl.classList.toggle("visible", isLoading);
        messageInput.disabled = isLoading;
        sendButton.disabled = isLoading;
        if (!isLoading) messageInput.focus();
      }

      async function loadInitial() {
        if (!conversationId && !accessToken) {
          renderMessage({
            role: "assistant",
            content: "Hola! Soy Renovebot. Cuéntame qué reforma tienes en mente y en qué zona sería.",
          });
          return;
        }
        try {
          const q = accessToken
            ? "token=" + encodeURIComponent(accessToken)
            : "id=" + encodeURIComponent(conversationId);
          const r = await fetch("/api/conversation?" + q);
          if (!r.ok) throw new Error("not found");
          const data = await r.json();
          conversationId = data.conversationId;
          accessToken = data.accessToken;
          if (!urlToken) localStorage.setItem(STORAGE_KEY, conversationId);
          (data.messages || []).forEach(renderMessage);
          (data.budgets || []).forEach(renderBudget);
          if (emailConfirmed) {
            renderMessage({
              role: "assistant",
              content: "Email confirmado. Ya puedes ver tu presupuesto orientativo en el chat.",
            });
            window.history.replaceState({}, document.title, location.pathname + (urlToken ? "?t=" + encodeURIComponent(urlToken) : ""));
          }
          if (data.botEnabled === false) {
            chatStatus.textContent = "Te atiende el equipo de Renoveplac";
          }
        } catch (err) {
          localStorage.removeItem(STORAGE_KEY);
          renderMessage({
            role: "assistant",
            content: "Hola! Soy Renovebot. Cuéntame qué reforma tienes en mente y en qué zona sería.",
          });
        }
      }

      async function sendMessage(text) {
        const pendingImage = pendingAttachment;
        let uploadedUrl = null;

        renderMessage({
          role: "user",
          content: text,
          image_url: pendingImage ? pendingImage.preview : null,
          _local: true,
        });

        setLoading(true);
        chatRequestInFlight = true;
        try {
          if (pendingImage) {
            const upBody = {
              data: pendingImage.base64,
              mimeType: pendingImage.mimeType,
            };
            if (conversationId) upBody.conversationId = conversationId;
            if (accessToken) upBody.token = accessToken;
            const upRes = await fetch("/api/upload", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(upBody),
            });
            const upData = await upRes.json();
            if (!upRes.ok) throw new Error(upData.error || "No se pudo subir la imagen");
            uploadedUrl = upData.url;
          }
          clearAttachment();

          const r = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              message: text,
              conversationId,
              token: accessToken,
              image_url: uploadedUrl,
            }),
          });
          const data = await r.json();
          if (!r.ok) throw new Error(data.error || "Error");
          conversationId = data.conversationId;
          if (data.accessToken) accessToken = data.accessToken;
          if (!urlToken && conversationId) localStorage.setItem(STORAGE_KEY, conversationId);
          if (data.botEnabled === false) {
            chatStatus.textContent = "Te atiende el equipo de Renoveplac";
          }
          if (data.userMessage && data.userMessage.id) {
            renderedMessageIds.add(data.userMessage.id);
            if (data.userMessage.created_at) lastMessageAt = data.userMessage.created_at;
          }
          if (data.budget) renderBudget(data.budget);
          if (data.assistantMessage) {
            renderMessage(data.assistantMessage);
          } else if (data.reply) {
            renderMessage({ role: "assistant", content: data.reply });
          }
        } catch (err) {
          renderMessage({
            role: "assistant",
            content: "Ahora mismo no he podido responder. Detalle técnico: " + err.message,
          });
        } finally {
          setLoading(false);
          chatRequestInFlight = false;
        }
      }

      async function poll() {
        if (chatRequestInFlight) return;
        if (!conversationId && !accessToken) return;
        try {
          const q = new URLSearchParams();
          if (conversationId) q.set("conversationId", conversationId);
          else if (accessToken) q.set("token", accessToken);
          if (lastMessageAt) q.set("since", lastMessageAt);
          const r = await fetch("/api/messages?" + q.toString());
          if (!r.ok) return;
          const data = await r.json();
          (data.messages || []).forEach(renderMessage);
          (data.budgets || []).forEach(renderBudget);
          if (data.botEnabled === false) {
            chatStatus.textContent = "Te atiende el equipo de Renoveplac";
          }
        } catch (_e) {}
      }

      chatForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const text = messageInput.value.trim();
        if (!text && !pendingAttachment) return;
        messageInput.value = "";
        sendMessage(text);
      });

      document.getElementById("resetButton").addEventListener("click", () => {
        if (!confirm("¿Empezar una conversación nueva? Se perderá el historial actual.")) return;
        localStorage.removeItem(STORAGE_KEY);
        location.href = location.pathname;
      });

      loadInitial();
      setInterval(poll, 6000);
    </script>
  </body>
</html>
