<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Renoveplac · Panel de gestión</title>
    <style>
      :root {
        --brand-orange: #ff7821;
        --brand-orange-soft: #ffb787;
        --brand-orange-hover: #e86200;
        --brand-orange-tint: #fff1e3;
        --brand-red: #ff4d1a;
        --gradient-brand: linear-gradient(135deg, #ff8c1a 0%, #ff4d1a 100%);
        --navy: #0a1428;
        --navy-soft: #14213d;
        --navy-deep: #050a18;
        --navy-line: #1d2e4f;
        --bg: #f4f6f9;
        --panel: #ffffff;
        --line: #e1e4ea;
        --line-strong: #c9cfd9;
        --text: #0a1428;
        --text-soft: #2a3554;
        --muted: #6b7383;
        --warn: #c92a2a;
        --warn-soft: #fde8e8;
        --warning: #b56500;
        --warning-soft: #fff3e0;
        --info: #1864ab;
        --info-soft: #e3f2fd;
        --success: #0c8c45;
        --success-soft: #d4f5e2;
        --user-bubble: #d9fdd3;
        --admin-bubble: #fff1e3;
        --admin-bubble-border: #ffb787;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 14.5px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      button { font-family: inherit; }
      input, textarea { font-family: inherit; }

      .login {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
        background: radial-gradient(circle at 30% 20%, var(--navy-soft) 0%, var(--navy) 50%, var(--navy-deep) 100%);
      }
      .login-card {
        background: #fff;
        padding: 36px 32px;
        border-radius: 16px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4);
        width: min(380px, 100%);
        text-align: center;
      }
      .login-logo-wrap {
        margin: 0 auto 18px;
        width: 80px; height: 80px;
        background: var(--navy);
        border-radius: 16px;
        display: grid; place-items: center;
        overflow: hidden;
      }
      .login-logo-img { max-width: 65px; max-height: 65px; object-fit: contain; display: block; }
      .login-logo-fallback {
        font-size: 38px;
        font-weight: 900;
        background: var(--gradient-brand);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: var(--brand-orange);
        line-height: 1;
      }
      .login-card h1 { margin: 0 0 4px; font-size: 22px; color: var(--navy); letter-spacing: 0.5px; }
      .login-card .subtitle { margin: 0 0 26px; color: var(--muted); font-size: 14px; }
      .login-card form { display: flex; flex-direction: column; gap: 12px; text-align: left; }
      .login-card label { font-size: 13px; font-weight: 600; color: var(--text); }
      .login-card input {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px 14px;
        font-size: 14px;
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      .login-card input:focus {
        outline: none;
        border-color: var(--brand-orange);
        box-shadow: 0 0 0 3px rgba(255, 120, 33, 0.18);
      }
      .login-card button {
        background: var(--gradient-brand);
        color: #fff;
        border: 0;
        border-radius: 10px;
        padding: 13px 14px;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
        margin-top: 4px;
        transition: filter 0.15s, transform 0.05s;
        letter-spacing: 0.3px;
      }
      .login-card button:hover { filter: brightness(1.06); }
      .login-card button:active { transform: translateY(1px); }
      .login-card .err {
        color: var(--warn);
        font-size: 13px;
        background: var(--warn-soft);
        padding: 10px 12px;
        border-radius: 8px;
        text-align: center;
      }

      .layout {
        --sidebar-width: 340px;
        display: grid;
        grid-template-columns: var(--sidebar-width) 8px minmax(0, 1fr);
        height: 100vh;
      }
      body.resizing-sidebar { cursor: col-resize; user-select: none; }
      .sidebar-resizer {
        background: linear-gradient(90deg, var(--navy-line), #dfe5ee);
        cursor: col-resize;
        touch-action: none;
        position: relative;
        z-index: 5;
      }
      .sidebar-resizer::after {
        content: "";
        position: absolute;
        top: 0; bottom: 0; left: 50%;
        width: 2px;
        transform: translateX(-50%);
        background: rgba(120, 136, 168, 0.55);
      }
      .sidebar-resizer:hover::after,
      .sidebar-resizer:focus-visible::after,
      body.resizing-sidebar .sidebar-resizer::after {
        background: var(--brand-orange);
      }
      .sidebar-resizer:focus-visible { outline: 2px solid var(--brand-orange); outline-offset: -2px; }

      .sidebar {
        background: var(--navy);
        color: #fff;
        display: flex; flex-direction: column;
        overflow: hidden;
        border-right: 1px solid var(--navy-line);
      }
      .sidebar-top {
        padding: 14px 18px;
        border-bottom: 1px solid var(--navy-line);
        display: flex; align-items: center; gap: 12px;
        background: var(--navy-deep);
      }
      .brand-mark {
        width: 44px; height: 44px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.05);
        display: grid; place-items: center;
        overflow: hidden;
        flex: 0 0 auto;
        border: 1px solid var(--navy-line);
      }
      .brand-logo-img { max-width: 36px; max-height: 36px; object-fit: contain; display: block; }
      .brand-logo-fallback {
        font-size: 22px; font-weight: 900;
        background: var(--gradient-brand);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
        line-height: 1;
      }
      .brand-text { line-height: 1.2; }
      .brand-text .name { font-size: 16px; font-weight: 700; color: #fff; letter-spacing: 0.4px; }
      .brand-text .role { font-size: 11.5px; color: var(--brand-orange-soft); letter-spacing: 0.3px; }
      .sidebar-top .logout {
        margin-left: auto;
        background: transparent; color: #c2cce0;
        border: 1px solid var(--navy-line);
        padding: 6px 12px; border-radius: 8px;
        font-size: 12.5px; cursor: pointer;
        transition: all 0.15s;
      }
      .sidebar-top .logout:hover { background: var(--brand-orange); border-color: var(--brand-orange); color: #fff; }
      .sidebar-search { padding: 12px 16px; border-bottom: 1px solid var(--navy-line); }
      .search-input { position: relative; }
      .search-input input {
        width: 100%;
        background: var(--navy-soft);
        border: 1px solid var(--navy-line);
        color: #fff; border-radius: 8px;
        padding: 8px 12px 8px 34px;
        font-size: 13px; transition: all 0.15s;
      }
      .search-input input::placeholder { color: #7888a8; }
      .search-input input:focus { outline: none; background: var(--navy-deep); border-color: var(--brand-orange); }
      .search-input svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: #7888a8; pointer-events: none; }
      .filters { display: flex; gap: 6px; padding: 10px 16px; border-bottom: 1px solid var(--navy-line); overflow-x: auto; }
      .filter-chip {
        background: transparent; color: #c2cce0;
        border: 1px solid var(--navy-line);
        padding: 4px 10px; border-radius: 12px;
        font-size: 12px; font-weight: 600;
        cursor: pointer; white-space: nowrap;
        transition: all 0.15s;
      }
      .filter-chip:hover { background: var(--navy-soft); }
      .filter-chip.active { background: var(--gradient-brand); color: #fff; border-color: transparent; }
      .filter-chip .count { margin-left: 4px; opacity: 0.9; font-weight: 500; }
      .conv-list { list-style: none; margin: 0; padding: 0; flex: 1; overflow-y: auto; }
      .conv-list li {
        padding: 12px 16px;
        border-bottom: 1px solid var(--navy-line);
        cursor: pointer; display: flex; gap: 12px;
        align-items: flex-start;
        transition: background 0.12s;
      }
      .conv-list li:hover { background: var(--navy-soft); }
      .conv-list li.active { background: var(--navy-deep); border-left: 3px solid var(--brand-orange); padding-left: 13px; }
      .conv-avatar {
        flex: 0 0 auto;
        width: 38px; height: 38px;
        border-radius: 50%;
        background: var(--gradient-brand);
        color: #fff;
        display: grid; place-items: center;
        font-weight: 700; font-size: 13.5px;
      }
      .conv-body { flex: 1; min-width: 0; }
      .conv-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
      .conv-list .name { font-size: 14px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .conv-list .time { font-size: 11px; color: #8c98b3; flex: 0 0 auto; }
      .conv-list .preview { font-size: 12.5px; color: #a2afcc; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .conv-list .badges { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
      .conv-delete {
        flex: 0 0 auto;
        width: 30px; height: 30px;
        border: 1px solid transparent;
        border-radius: 8px;
        background: transparent;
        color: #8c98b3;
        cursor: pointer;
        display: grid; place-items: center;
        margin-top: 2px;
        transition: all 0.15s;
      }
      .conv-delete:hover { background: var(--warn-soft); border-color: #f4cfcf; color: var(--warn); }
      .conv-delete svg { width: 15px; height: 15px; }
      .empty-list { padding: 40px 20px; text-align: center; color: #8c98b3; font-size: 13px; }

      .badge {
        display: inline-block;
        font-size: 10.5px; padding: 2px 8px;
        border-radius: 10px; font-weight: 700;
        text-transform: uppercase; letter-spacing: 0.4px;
      }
      .badge-active { background: var(--success-soft); color: var(--success); }
      .badge-budget_sent { background: var(--brand-orange-tint); color: var(--brand-orange-hover); }
      .badge-budget_accepted { background: #cce4ff; color: #0a3d6c; }
      .badge-closed { background: #99a2b5; color: #fff; }
      .badge-bot-paused { background: #ff9b9b; color: #5a0e0e; }

      .main { display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }
      .empty { flex: 1; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 40px; }
      .empty svg { color: var(--brand-orange); opacity: 0.3; margin-bottom: 16px; }
      .empty h3 { margin: 0 0 6px; color: var(--text); font-weight: 600; font-size: 17px; }
      .empty p { margin: 0; font-size: 14px; }

      .conv-header { background: #fff; border-bottom: 1px solid var(--line); padding: 14px 22px; display: flex; align-items: center; gap: 14px; }
      .avatar-lg {
        width: 46px; height: 46px;
        border-radius: 50%;
        background: var(--gradient-brand);
        color: #fff;
        display: grid; place-items: center;
        font-weight: 700; font-size: 18px;
        flex: 0 0 auto;
      }
      .conv-header .info { flex: 1; min-width: 0; }
      .conv-header .info .title { font-weight: 700; font-size: 17px; color: var(--navy); line-height: 1.25; }
      .conv-header .info .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
      .chip {
        display: inline-flex; align-items: center; gap: 5px;
        background: var(--bg); border: 1px solid var(--line);
        padding: 3px 10px; border-radius: 12px;
        font-size: 12px; color: var(--text-soft); font-weight: 500;
      }
      .conv-actions { display: flex; gap: 8px; flex-shrink: 0; }
      .btn {
        background: #fff; color: var(--text);
        border: 1px solid var(--line-strong);
        padding: 8px 14px; border-radius: 8px;
        font-size: 13px; font-weight: 600; cursor: pointer;
        display: inline-flex; align-items: center; gap: 6px;
        transition: all 0.15s;
      }
      .btn:hover { background: var(--bg); border-color: var(--muted); }
      .btn-warn { background: #fff; color: var(--warn); border-color: #f4cfcf; }
      .btn-warn:hover { background: var(--warn-soft); border-color: var(--warn); }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; }
      .btn svg { width: 14px; height: 14px; }

      .lead-card {
        background: #fff; border-bottom: 1px solid var(--line);
        padding: 14px 22px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 14px 24px; font-size: 13.5px;
      }
      .lead-card .field { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
      .lead-card .field.email { grid-column: span 2; }
      .lead-card .field.phone { min-width: 150px; }
      .lead-card .field-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); font-weight: 700; }
      .lead-card .field-value { color: var(--text); font-weight: 500; overflow-wrap: anywhere; word-break: break-word; line-height: 1.35; }
      .lead-card .field-value.empty { color: var(--muted); font-style: italic; font-weight: 400; }
      .lead-card .original-message {
        grid-column: 1 / -1;
        background: var(--bg);
        padding: 10px 14px; border-radius: 8px;
        border-left: 3px solid var(--brand-orange);
        font-size: 13.5px; color: var(--text);
        margin-top: 4px;
      }
      .lead-card .original-message strong { color: var(--brand-orange-hover); }

      @media (max-width: 980px) {
        .lead-card .field.email { grid-column: 1 / -1; }
      }

      .messages-pane { flex: 1; overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 8px; }
      .msg-group { display: flex; gap: 10px; align-items: flex-end; }
      .msg-group.user { justify-content: flex-end; }
      .avatar-msg {
        width: 30px; height: 30px;
        border-radius: 50%; background: var(--navy);
        color: #fff;
        display: grid; place-items: center;
        font-weight: 700; font-size: 11.5px;
        flex: 0 0 auto;
      }
      .avatar-msg.admin { background: var(--gradient-brand); color: #fff; }
      .avatar-msg.bot { background: var(--navy); }
      .bubble {
        max-width: 70%;
        padding: 10px 14px;
        border-radius: 14px;
        font-size: 14.5px; line-height: 1.45;
        white-space: pre-wrap; overflow-wrap: anywhere;
        box-shadow: 0 1px 2px rgba(0,0,0,0.04);
      }
      .bubble.bot { background: #fff; border: 1px solid var(--line); border-bottom-left-radius: 4px; }
      .bubble.user { background: var(--user-bubble); border-bottom-right-radius: 4px; }
      .bubble.admin { background: var(--admin-bubble); border: 1px solid var(--admin-bubble-border); border-bottom-left-radius: 4px; }
      .bubble .meta { display: block; color: var(--muted); font-size: 11px; margin-top: 4px; }
      .bubble .meta strong { color: var(--text); font-weight: 600; }

      .budget-card {
        max-width: 75%;
        margin-left: 40px;
        background: linear-gradient(180deg, #fff 0%, #fffaf3 100%);
        border: 1px solid var(--brand-orange);
        border-radius: 14px;
        padding: 16px;
        box-shadow: 0 4px 14px rgba(255, 120, 33, 0.12);
      }
      .budget-card .b-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
      .budget-card h4 { margin: 0; color: var(--brand-orange-hover); font-size: 15.5px; }
      .budget-card .amount {
        font-size: 26px; font-weight: 800;
        background: var(--gradient-brand);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
        color: var(--brand-orange);
        margin: 4px 0 8px; line-height: 1.1;
      }
      .budget-card .amount .iva { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 4px; -webkit-text-fill-color: var(--muted); }
      .budget-card .desc { font-size: 13.5px; color: var(--text); white-space: pre-wrap; line-height: 1.45; }
      .budget-card .b-footer { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
      .tag-status {
        display: inline-flex; align-items: center; gap: 4px;
        font-size: 11.5px; padding: 3px 10px;
        border-radius: 10px; font-weight: 700;
        text-transform: uppercase; letter-spacing: 0.4px;
      }
      .tag-status.pending { background: var(--warning-soft); color: var(--warning); }
      .tag-status.accepted { background: var(--info-soft); color: var(--info); }
      .tag-status.rejected { background: var(--warn-soft); color: var(--warn); }
      .tag-status svg { width: 12px; height: 12px; }
      .b-time { font-size: 11.5px; color: var(--muted); }

      .reply-zone { background: #fff; border-top: 1px solid var(--line); padding: 12px 18px 14px; }
      .reply-status { font-size: 12.5px; color: var(--muted); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
      .reply-status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); }
      .reply-status.paused .dot { background: var(--warn); }
      .reply-form { display: flex; gap: 8px; align-items: flex-end; }
      .reply-form textarea {
        flex: 1; resize: vertical;
        min-height: 56px; max-height: 200px;
        border: 1px solid var(--line-strong);
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 14px; line-height: 1.4;
        transition: all 0.15s;
      }
      .reply-form textarea:focus { outline: none; border-color: var(--brand-orange); box-shadow: 0 0 0 3px rgba(255, 120, 33, 0.15); }
      .send-btn {
        background: var(--gradient-brand);
        color: #fff; border: 0; border-radius: 10px;
        padding: 10px 18px;
        font-weight: 700; font-size: 14px;
        cursor: pointer; height: 56px;
        display: inline-flex; align-items: center; gap: 6px;
        transition: filter 0.15s;
      }
      .send-btn:hover { filter: brightness(1.06); }
      .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
      .reply-hint { font-size: 11.5px; color: var(--muted); margin-top: 6px; }

      .closed-banner { background: var(--warn-soft); color: var(--warn); padding: 14px 18px; border-top: 1px solid #f4cfcf; text-align: center; font-size: 13.5px; font-weight: 600; }

      .toast-stack { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 1000; }
      .toast { background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3); animation: toastIn 0.18s ease-out; max-width: 320px; }
      .toast.error { background: var(--warn); }
      .toast.success { background: var(--success); }
      @keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
  </head>
  <body>
    <div id="loginScreen" class="login">
      <div class="login-card">
        <div class="login-logo-wrap">
          <img src="/renoveplacLogo.png" alt="Renoveplac" class="login-logo-img"
               onerror="this.outerHTML='<div class=&quot;login-logo-fallback&quot;>R</div>'" />
        </div>
        <h1>RENOVEPLAC</h1>
        <p class="subtitle">Panel de gestión</p>
        <form id="loginForm">
          <label for="pwd">Contraseña de administrador</label>
          <input type="password" id="pwd" placeholder="Introduce la contraseña" required autofocus />
          <div class="err" id="loginErr" style="display:none"></div>
          <button type="submit">Entrar</button>
        </form>
      </div>
    </div>

    <div id="appScreen" class="layout" style="display:none">
      <aside class="sidebar">
        <div class="sidebar-top">
          <div class="brand-mark">
            <img src="/renoveplacLogo.png" alt="Renoveplac" class="brand-logo-img"
                 onerror="this.outerHTML='<div class=&quot;brand-logo-fallback&quot;>R</div>'" />
          </div>
          <div class="brand-text">
            <div class="name">RENOVEPLAC</div>
            <div class="role">Panel de gestión</div>
          </div>
          <button class="logout" id="logoutBtn">Salir</button>
        </div>
        <div class="sidebar-search">
          <div class="search-input">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input id="searchInput" placeholder="Buscar nombre, email, zona..." />
          </div>
        </div>
        <div class="filters" id="filters">
          <button class="filter-chip active" data-filter="all">Todas <span class="count" id="count-all">0</span></button>
          <button class="filter-chip" data-filter="active">Activas <span class="count" id="count-active">0</span></button>
          <button class="filter-chip" data-filter="budget_sent">Presupuesto <span class="count" id="count-budget_sent">0</span></button>
          <button class="filter-chip" data-filter="budget_accepted">Aceptado <span class="count" id="count-budget_accepted">0</span></button>
          <button class="filter-chip" data-filter="closed">Cerradas <span class="count" id="count-closed">0</span></button>
        </div>
        <ul class="conv-list" id="convList"></ul>
      </aside>

      <div
        class="sidebar-resizer"
        id="sidebarResizer"
        role="separator"
        aria-orientation="vertical"
        aria-label="Cambiar ancho del listado de conversaciones"
        tabindex="0"
      ></div>

      <main class="main" id="mainPane">
        <div class="empty">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <h3>Selecciona una conversación</h3>
          <p>Elige un chat de la izquierda para ver el historial y responder.</p>
        </div>
      </main>
    </div>

    <div class="toast-stack" id="toastStack"></div>

    <script>
      const TOKEN_KEY = "renovebot.adminToken";
      const loginScreen = document.getElementById("loginScreen");
      const appScreen = document.getElementById("appScreen");
      const loginForm = document.getElementById("loginForm");
      const loginErr = document.getElementById("loginErr");
      const pwdInput = document.getElementById("pwd");
      const convList = document.getElementById("convList");
      const mainPane = document.getElementById("mainPane");
      const logoutBtn = document.getElementById("logoutBtn");
      const searchInput = document.getElementById("searchInput");
      const filtersEl = document.getElementById("filters");
      const toastStack = document.getElementById("toastStack");
      const sidebarResizer = document.getElementById("sidebarResizer");

      let token = localStorage.getItem(TOKEN_KEY) || null;
      let activeId = null;
      let pollTimer = null;
      let allConversations = [];
      let activeFilter = "all";
      let searchQuery = "";
      let renderedConversationId = null;
      const replyDraftByConversation = {};
      const SIDEBAR_WIDTH_KEY = "renovebot.adminSidebarWidth";
      const SIDEBAR_MIN = 280;
      const SIDEBAR_MAX = 640;

      function authHeaders() { return token ? { Authorization: "Bearer " + token } : {}; }
      function escapeHtml(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
      }
      function fmtDateTime(s) {
        if (!s) return "";
        const d = new Date(s);
        return d.toLocaleString("es-ES", { dateStyle: "short", timeStyle: "short" });
      }
      function fmtRelative(s) {
        if (!s) return "";
        const d = new Date(s);
        const diff = (new Date() - d) / 1000;
        if (diff < 60) return "ahora";
        if (diff < 3600) return Math.floor(diff / 60) + "m";
        if (diff < 86400) return Math.floor(diff / 3600) + "h";
        if (diff < 604800) return Math.floor(diff / 86400) + "d";
        return d.toLocaleDateString("es-ES", { day: "2-digit", month: "2-digit" });
      }
      function initials(name) {
        if (!name) return "?";
        const parts = String(name).trim().split(/\s+/);
        if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
        return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
      }
      function statusLabel(s) {
        return ({ active: "Activa", budget_sent: "Presupuesto enviado", budget_accepted: "Presupuesto aceptado", closed: "Cerrada" })[s] || "Activa";
      }
      function sourceLabel(c) {
        if (c.channel === "whatsapp" || c.source === "whatsapp") return "WhatsApp";
        if (c.source === "form") return "Formulario web";
        return "Widget chat";
      }
      function renderEmptyPane() {
        renderedConversationId = null;
        mainPane.innerHTML =
          '<div class="empty">' +
            '<svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>' +
            '<h3>Selecciona una conversacion</h3>' +
            '<p>Elige un chat de la izquierda para ver el historial y responder.</p>' +
          '</div>';
      }
      function isWritingReply() {
        const ta = document.getElementById("replyText");
        return !!(ta && document.activeElement === ta);
      }
      function toast(msg, type) {
        const el = document.createElement("div");
        el.className = "toast" + (type ? " " + type : "");
        el.textContent = msg;
        toastStack.appendChild(el);
        setTimeout(() => { el.style.opacity = "0"; el.style.transition = "opacity 0.2s"; setTimeout(() => el.remove(), 220); }, 3000);
      }
      function clampSidebarWidth(width) {
        const maxByViewport = Math.max(SIDEBAR_MIN, Math.min(SIDEBAR_MAX, Math.floor(window.innerWidth * 0.62)));
        return Math.max(SIDEBAR_MIN, Math.min(maxByViewport, Math.round(width)));
      }
      function setSidebarWidth(width, persist = true) {
        const next = clampSidebarWidth(width);
        appScreen.style.setProperty("--sidebar-width", next + "px");
        sidebarResizer.setAttribute("aria-valuenow", String(next));
        sidebarResizer.setAttribute("aria-valuemin", String(SIDEBAR_MIN));
        sidebarResizer.setAttribute("aria-valuemax", String(SIDEBAR_MAX));
        if (persist) localStorage.setItem(SIDEBAR_WIDTH_KEY, String(next));
      }
      function initSidebarResize() {
        const saved = Number(localStorage.getItem(SIDEBAR_WIDTH_KEY));
        if (Number.isFinite(saved) && saved > 0) setSidebarWidth(saved, false);

        let dragging = false;
        const onMove = (event) => {
          if (!dragging) return;
          setSidebarWidth(event.clientX);
        };
        const stop = () => {
          if (!dragging) return;
          dragging = false;
          document.body.classList.remove("resizing-sidebar");
          window.removeEventListener("pointermove", onMove);
          window.removeEventListener("pointerup", stop);
          window.removeEventListener("pointercancel", stop);
        };
        sidebarResizer.addEventListener("pointerdown", (event) => {
          dragging = true;
          sidebarResizer.setPointerCapture?.(event.pointerId);
          document.body.classList.add("resizing-sidebar");
          window.addEventListener("pointermove", onMove);
          window.addEventListener("pointerup", stop);
          window.addEventListener("pointercancel", stop);
          event.preventDefault();
        });
        sidebarResizer.addEventListener("keydown", (event) => {
          if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
          const current = Number(getComputedStyle(appScreen).getPropertyValue("--sidebar-width").replace("px", "")) || 340;
          if (event.key === "ArrowLeft") setSidebarWidth(current - 24);
          if (event.key === "ArrowRight") setSidebarWidth(current + 24);
          if (event.key === "Home") setSidebarWidth(SIDEBAR_MIN);
          if (event.key === "End") setSidebarWidth(SIDEBAR_MAX);
          event.preventDefault();
        });
        window.addEventListener("resize", () => {
          const current = Number(getComputedStyle(appScreen).getPropertyValue("--sidebar-width").replace("px", "")) || 340;
          setSidebarWidth(current, false);
        });
      }

      async function login(password) {
        const r = await fetch("/api/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password }),
        });
        if (!r.ok) { const err = await r.json().catch(() => ({})); throw new Error(err.error || "Contraseña incorrecta."); }
        const data = await r.json();
        token = data.token;
        localStorage.setItem(TOKEN_KEY, token);
      }
      function logout() {
        token = null;
        localStorage.removeItem(TOKEN_KEY);
        clearInterval(pollTimer);
        appScreen.style.display = "none";
        loginScreen.style.display = "grid";
        activeId = null;
        pwdInput.value = "";
        pwdInput.focus();
      }

      async function loadConversations() {
        try {
          const r = await fetch("/api/admin/conversations", { headers: authHeaders() });
          if (r.status === 401) return logout();
          if (!r.ok) {
            const err = await r.json().catch(() => ({}));
            convList.innerHTML =
              '<li class="empty-list">' +
              escapeHtml(err.error || "Error cargando conversaciones.") +
              (err.supabaseHost ? '<br><small>' + escapeHtml(err.supabaseHost) + '</small>' : "") +
              '</li>';
            return;
          }
          const data = await r.json();
          allConversations = data.conversations || [];
          renderList();
          updateCounts();
        } catch (err) {
          convList.innerHTML = '<li class="empty-list">Error de conexión cargando conversaciones.</li>';
        }
      }
      function updateCounts() {
        const counts = { all: allConversations.length, active: 0, budget_sent: 0, budget_accepted: 0, closed: 0 };
        allConversations.forEach((c) => { const s = c.status || "active"; if (counts[s] != null) counts[s]++; });
        Object.entries(counts).forEach(([k, v]) => { const el = document.getElementById("count-" + k); if (el) el.textContent = v; });
      }
      function filterConversations() {
        return allConversations.filter((c) => {
          const status = c.status || "active";
          if (activeFilter !== "all" && status !== activeFilter) return false;
          if (searchQuery) {
            const q = searchQuery.toLowerCase();
            const fields = [c.customer_name, c.customer_email, c.customer_phone, c.customer_postal_code, c.work_type].filter(Boolean).join(" ").toLowerCase();
            if (!fields.includes(q)) return false;
          }
          return true;
        });
      }
      function renderList() {
        const list = filterConversations();
        if (!list.length) { convList.innerHTML = '<li class="empty-list">No hay conversaciones que mostrar.</li>'; return; }
        convList.innerHTML = "";
        list.forEach((c) => {
          const li = document.createElement("li");
          if (c.id === activeId) li.classList.add("active");
          const label = c.customer_name || c.customer_email || "Sin nombre";
          const status = c.status || "active";
          const subline = c.work_type || c.customer_postal_code || c.customer_phone || c.customer_email || sourceLabel(c);
          const botPaused = c.bot_enabled === false;
          li.innerHTML =
            '<div class="conv-avatar">' + escapeHtml(initials(label)) + '</div>' +
            '<div class="conv-body">' +
              '<div class="conv-row">' +
                '<span class="name">' + escapeHtml(label) + '</span>' +
                '<span class="time">' + escapeHtml(fmtRelative(c.updated_at)) + '</span>' +
              '</div>' +
              '<div class="preview">' + escapeHtml(subline) + '</div>' +
              '<div class="badges">' +
                '<span class="badge badge-' + status + '">' + escapeHtml(statusLabel(status)) + '</span>' +
                (botPaused ? '<span class="badge badge-bot-paused">Bot pausado</span>' : "") +
              '</div>' +
            '</div>';
          li.addEventListener("click", () => openConversation(c.id));
          const deleteBtn = document.createElement("button");
          deleteBtn.className = "conv-delete";
          deleteBtn.type = "button";
          deleteBtn.title = "Eliminar conversacion";
          deleteBtn.setAttribute("aria-label", "Eliminar conversacion");
          deleteBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>';
          deleteBtn.addEventListener("click", (ev) => {
            ev.stopPropagation();
            deleteConversation(c.id, label);
          });
          li.appendChild(deleteBtn);
          convList.appendChild(li);
        });
      }

      async function openConversation(id, options = {}) {
        activeId = id;
        renderList();
        try {
          const r = await fetch("/api/admin/conversations/" + id, { headers: authHeaders() });
          if (r.status === 401) return logout();
          if (!r.ok) {
            if (!options.silent) toast("No se pudo cargar la conversacion.", "error");
            return;
          }
          const conv = await r.json();
          const idx = allConversations.findIndex((c) => c.id === conv.id);
          if (idx >= 0) {
            allConversations[idx] = { ...allConversations[idx], ...conv };
            renderList();
          }
          renderConversation(conv, options);
        } catch (_) { if (!options.silent) toast("Error de red.", "error"); }
      }

      function renderConversation(conv, options = {}) {
        const previousReply = document.getElementById("replyText");
        const wasSameConversation = renderedConversationId === conv.id;
        const replyWasFocused = wasSameConversation && previousReply && document.activeElement === previousReply;
        const replySelectionStart = previousReply ? previousReply.selectionStart : null;
        const replySelectionEnd = previousReply ? previousReply.selectionEnd : null;
        if (previousReply && renderedConversationId) {
          replyDraftByConversation[renderedConversationId] = previousReply.value;
        }

        const name = conv.customer_name || "Cliente sin nombre";
        const status = conv.status || "active";
        const botEnabled = conv.bot_enabled !== false;
        const isClosed = status === "closed";
        const previousPane = document.getElementById("messagesPane");
        const preserveScroll = options.preserveScroll && previousPane;
        const previousTop = previousPane ? previousPane.scrollTop : 0;
        const previousHeight = previousPane ? previousPane.scrollHeight : 0;
        const wasNearBottom = previousPane
          ? previousPane.scrollHeight - previousPane.scrollTop - previousPane.clientHeight < 90
          : true;

        const headerHtml =
          '<div class="conv-header">' +
            '<div class="avatar-lg">' + escapeHtml(initials(name)) + '</div>' +
            '<div class="info">' +
              '<div class="title">' + escapeHtml(name) + '</div>' +
              '<div class="chips">' +
                '<span class="badge badge-' + status + '">' + escapeHtml(statusLabel(status)) + '</span>' +
                (botEnabled ? "" : '<span class="badge badge-bot-paused">Bot pausado</span>') +
                (conv.work_type ? '<span class="chip">' + escapeHtml(conv.work_type) + '</span>' : "") +
                (conv.customer_postal_code ? '<span class="chip">CP ' + escapeHtml(conv.customer_postal_code) + '</span>' : "") +
              '</div>' +
            '</div>' +
            '<div class="conv-actions">' +
              (isClosed ? "" :
                '<button class="btn" id="toggleBotBtn">' +
                  (botEnabled
                    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg> Pausar bot'
                    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg> Reactivar bot') +
                '</button>' +
                '<button class="btn btn-warn" id="closeBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg> Cerrar</button>'
              ) +
            '</div>' +
          '</div>';

        const leadFields = [
          { label: "Email", value: conv.customer_email, cls: "email" },
          { label: "Teléfono", value: conv.customer_phone, cls: "phone" },
          { label: "Código postal", value: conv.customer_postal_code },
          { label: "Solicitudes email", value: conv.lead_stats ? String(conv.lead_stats.budget_request_count || 0) : "" },
          { label: "Origen", value: sourceLabel(conv) },
          { label: "Creada", value: fmtDateTime(conv.created_at) },
        ];
        const leadHtml =
          '<div class="lead-card">' +
            leadFields.map((f) =>
              '<div class="field ' + escapeHtml(f.cls || "") + '">' +
                '<span class="field-label">' + escapeHtml(f.label) + '</span>' +
                '<span class="field-value' + (f.value ? "" : " empty") + '">' + escapeHtml(f.value || "—") + '</span>' +
              '</div>'
            ).join("") +
            (conv.initial_message ? '<div class="original-message"><strong>Mensaje original:</strong> ' + escapeHtml(conv.initial_message) + '</div>' : "") +
          '</div>';

        const items = [];
        (conv.messages || []).forEach((m) => items.push({ kind: "msg", at: m.created_at, data: m }));
        (conv.budgets || []).forEach((b) => items.push({ kind: "budget", at: b.created_at, data: b }));
        items.sort((a, b) => new Date(a.at) - new Date(b.at));
        const messagesHtml = items.length
          ? items.map((it) => it.kind === "msg" ? renderMessageItem(it.data) : renderBudgetItem(it.data)).join("")
          : '<div class="empty" style="padding:30px"><p>Aún no hay mensajes.</p></div>';

        const replyHtml = isClosed
          ? '<div class="closed-banner">Conversación cerrada · El cliente ya no puede escribir.</div>'
          : '<div class="reply-zone">' +
              '<div class="reply-status' + (botEnabled ? "" : " paused") + '">' +
                '<span class="dot"></span>' +
                (botEnabled ? "Bot atendiendo. Si respondes tú, el cliente lo verá como mensaje del equipo." : "Bot pausado · estás respondiendo tú directamente.") +
              '</div>' +
              '<form class="reply-form" id="replyForm">' +
                '<textarea id="replyText" placeholder="Escribe tu respuesta como Renoveplac..." rows="2"></textarea>' +
                '<button type="submit" class="send-btn">' +
                  '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>' +
                  ' Enviar' +
                '</button>' +
              '</form>' +
              '<div class="reply-hint">Enter para enviar. Shift + Enter para salto de línea.</div>' +
            '</div>';

        renderedConversationId = conv.id;
        mainPane.innerHTML = headerHtml + leadHtml +
          '<div class="messages-pane" id="messagesPane">' + messagesHtml + '</div>' +
          replyHtml;

        const messagesPane = document.getElementById("messagesPane");
        if (messagesPane) {
          if (preserveScroll && !wasNearBottom) {
            messagesPane.scrollTop = Math.max(0, previousTop + messagesPane.scrollHeight - previousHeight);
          } else {
            messagesPane.scrollTop = messagesPane.scrollHeight;
          }
        }

        const toggleBtn = document.getElementById("toggleBotBtn");
        if (toggleBtn) toggleBtn.addEventListener("click", () => toggleBot(!botEnabled));
        const closeBtn = document.getElementById("closeBtn");
        if (closeBtn) closeBtn.addEventListener("click", closeConversation);
        const replyForm = document.getElementById("replyForm");
        if (replyForm) {
          replyForm.addEventListener("submit", onReply);
          const ta = document.getElementById("replyText");
          ta.value = replyDraftByConversation[conv.id] || "";
          ta.addEventListener("input", () => {
            replyDraftByConversation[conv.id] = ta.value;
          });
          ta.addEventListener("keydown", (ev) => {
            if (ev.key === "Enter" && !ev.shiftKey && !ev.isComposing) {
              ev.preventDefault();
              replyForm.requestSubmit();
            }
          });
          if (replyWasFocused) {
            requestAnimationFrame(() => {
              ta.focus();
              const start = Math.min(replySelectionStart ?? ta.value.length, ta.value.length);
              const end = Math.min(replySelectionEnd ?? start, ta.value.length);
              ta.setSelectionRange(start, end);
            });
          }
        }
      }

      function renderMessageItem(m) {
        const role = m.role === "user" ? "user" : m.role === "admin" ? "admin" : "bot";
        const who = role === "user" ? "Cliente" : role === "admin" ? "Renoveplac" : "Renovebot";
        const initialsAvatar = role === "admin" ? "RP" : "RB";
        const imageHtml = m.image_url
          ? '<a href="' + escapeHtml(m.image_url) + '" target="_blank" rel="noopener"><img src="' + escapeHtml(m.image_url) + '" alt="Imagen adjunta" style="display:block;max-width:280px;max-height:280px;border-radius:8px;margin-bottom:6px;cursor:zoom-in;" /></a>'
          : "";
        const textVal = String(m.content || "");
        const textHtml = (textVal && textVal !== "(imagen)") ? escapeHtml(textVal) : "";
        return (
          '<div class="msg-group ' + role + '">' +
            (role === "user" ? "" : '<div class="avatar-msg ' + role + '">' + escapeHtml(initialsAvatar) + '</div>') +
            '<div class="bubble ' + role + '">' +
              imageHtml +
              textHtml +
              '<span class="meta"><strong>' + escapeHtml(who) + '</strong> · ' + escapeHtml(fmtDateTime(m.created_at)) + '</span>' +
            '</div>' +
          '</div>'
        );
      }

      function renderBudgetItem(b) {
        const ivaTxt = b.iva_included ? "(IVA incluido)" : "+ IVA aparte";
        const status = b.status || "pending";
        const waitingEmail = b.email_confirmation_required && !b.email_confirmed_at;
        const tagText = waitingEmail ? "Pendiente email" : status === "accepted" ? "Aceptado" : status === "rejected" ? "Rechazado" : "Pendiente";
        const tagIcon = status === "accepted"
          ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>'
          : status === "rejected"
          ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>'
          : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';
        const acceptedTime = waitingEmail
          ? '<span class="b-time">Email enviado a ' + escapeHtml(b.email_confirmation_email || "") + '</span>'
          : status === "accepted" && b.accepted_at
          ? '<span class="b-time">Aceptado el ' + escapeHtml(fmtDateTime(b.accepted_at)) + '</span>'
          : '<span class="b-time">Creado el ' + escapeHtml(fmtDateTime(b.created_at)) + '</span>';
        return (
          '<div class="budget-card">' +
            '<div class="b-header">' +
              '<h4>' + escapeHtml(b.title) + '</h4>' +
              '<span class="tag-status ' + status + '">' + tagIcon + ' ' + tagText + '</span>' +
            '</div>' +
            '<div class="amount">' + Number(b.amount_eur).toLocaleString("es-ES") + ' € <span class="iva">' + ivaTxt + '</span></div>' +
            '<div class="desc">' + escapeHtml(b.description) + '</div>' +
            '<div class="b-footer">' + acceptedTime + '</div>' +
          '</div>'
        );
      }

      async function onReply(e) {
        e.preventDefault();
        const ta = document.getElementById("replyText");
        const sendBtn = document.querySelector(".send-btn");
        const text = ta.value.trim();
        const conversationId = activeId;
        if (!text || !conversationId) return;
        sendBtn.disabled = true;
        try {
          const r = await fetch("/api/admin/conversations/" + conversationId + "/reply", {
            method: "POST",
            headers: { "Content-Type": "application/json", ...authHeaders() },
            body: JSON.stringify({ content: text }),
          });
          if (!r.ok) throw new Error("Error enviando");
          delete replyDraftByConversation[conversationId];
          ta.value = "";
          toast("Respuesta enviada al cliente.", "success");
          await openConversation(conversationId);
        } catch (err) {
          toast("No se pudo enviar la respuesta.", "error");
        } finally {
          sendBtn.disabled = false;
        }
      }

      async function toggleBot(enabled) {
        if (!activeId) return;
        try {
          await fetch("/api/admin/conversations/" + activeId + "/toggle-bot", {
            method: "POST",
            headers: { "Content-Type": "application/json", ...authHeaders() },
            body: JSON.stringify({ enabled }),
          });
          toast(enabled ? "Bot reactivado." : "Bot pausado · atiendes tú.", "success");
          await openConversation(activeId);
          await loadConversations();
        } catch (_) { toast("No se pudo cambiar el estado del bot.", "error"); }
      }

      async function closeConversation() {
        if (!activeId) return;
        if (!confirm("¿Cerrar esta conversación? El cliente no podrá escribir más.")) return;
        try {
          await fetch("/api/admin/conversations/" + activeId + "/close", {
            method: "POST",
            headers: authHeaders(),
          });
          toast("Conversación cerrada.", "success");
          await openConversation(activeId);
          await loadConversations();
        } catch (_) { toast("No se pudo cerrar la conversación.", "error"); }
      }

      async function deleteConversation(id, label) {
        if (!id) return;
        if (!confirm("Eliminar definitivamente la conversacion de " + label + "?")) return;
        try {
          const r = await fetch("/api/admin/conversations/" + id + "/delete", {
            method: "POST",
            headers: authHeaders(),
          });
          if (!r.ok) throw new Error("delete failed");
          if (activeId === id) {
            activeId = null;
            renderedConversationId = null;
            renderEmptyPane();
          }
          delete replyDraftByConversation[id];
          toast("Conversacion eliminada.", "success");
          await loadConversations();
        } catch (_) {
          toast("No se pudo eliminar la conversacion.", "error");
        }
      }

      filtersEl.addEventListener("click", (e) => {
        const btn = e.target.closest(".filter-chip");
        if (!btn) return;
        document.querySelectorAll(".filter-chip").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        activeFilter = btn.dataset.filter;
        renderList();
      });
      searchInput.addEventListener("input", (e) => { searchQuery = e.target.value.trim(); renderList(); });
      initSidebarResize();

      function startApp() {
        loginScreen.style.display = "none";
        appScreen.style.display = "grid";
        loadConversations();
        const hash = window.location.hash.replace(/^#/, "");
        if (hash) openConversation(hash);
        clearInterval(pollTimer);
        pollTimer = setInterval(() => {
          loadConversations();
          if (activeId && !isWritingReply()) {
            openConversation(activeId, { preserveScroll: true, silent: true });
          }
        }, 8000);
      }

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        loginErr.style.display = "none";
        loginErr.textContent = "";
        try { await login(pwdInput.value); startApp(); }
        catch (err) { loginErr.textContent = err.message; loginErr.style.display = "block"; }
      });
      logoutBtn.addEventListener("click", logout);

      if (token) startApp();
    </script>
  </body>
</html>
